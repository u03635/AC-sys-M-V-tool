<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESG 空調現場量測驗證工具</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --text-color: #E0E0E0;
            --border-color: #333333;
            --accent-color: #4A90E2;
            --success-color: #00FF00;
            --error-color: #FF5252;
            --highlight-color: #F5A623;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: var(--surface-color);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.95rem; color: #BBBBBB; }
        input, select {
            width: 100%; padding: 12px; box-sizing: border-box;
            background-color: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 6px; font-size: 16px;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent-color); }
        .capacity-input-group { display: flex; gap: 5px; }
        .capacity-input-group input { flex: 2; }
        .capacity-input-group select { flex: 1; padding: 12px 5px; font-size: 0.9rem; }
        button {
            width: 100%; padding: 15px; background-color: var(--accent-color);
            color: #FFFFFF; border: none; border-radius: 6px; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        #result-box {
            margin-top: 25px; border-radius: 6px; display: none;
        }
        .result-section {
            background-color: var(--bg-color); padding: 15px; border-radius: 6px; margin-bottom: 15px;
        }
        .section-title {
            font-size: 0.9rem; color: var(--highlight-color); margin-bottom: 10px; border-bottom: 1px dashed var(--border-color); padding-bottom: 5px;
        }
        .valid { color: var(--success-color); font-weight: bold; }
        .invalid { color: var(--error-color); font-weight: bold; }
        .result-row {
            display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem;
        }
        .result-row:last-child { margin-bottom: 0; }
        .value-text { font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>ESG 現場驗證工具</h2>
    <div class="form-group">
        <label>系統側別</label>
        <select id="sys_type">
            <option value="cooling">冷卻水側 (Cooling Water)</option>
            <option value="chilled">冰水側 (Chilled Water)</option>
        </select>
    </div>
    
    <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1.2;">
            <label>銘牌冷凍能力</label>
            <div class="capacity-input-group">
                <input type="number" id="capacity_val" step="0.1" value="23.25">
                <select id="capacity_unit">
                    <option value="usrt">USRT</option>
                    <option value="kcal_hr">kcal/hr</option>
                    <option value="kw_cooling">kW</option>
                </select>
            </div>
        </div>
        <div class="form-group" style="flex: 0.8;">
            <label>銘牌耗電 (Power kW)</label>
            <input type="number" id="rated_power_kw" step="0.1" value="34.5">
        </div>
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
            <label>現場進水溫 (°C)</label>
            <input type="number" id="temp_in" step="0.1" value="32">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>現場出水溫 (°C)</label>
            <input type="number" id="temp_out" step="0.1" value="37">
        </div>
    </div>

    <div class="form-group">
        <label>現場量測流量 (LPM)</label>
        <input type="number" id="measured_flow" step="0.1" value="350">
    </div>

    <div class="form-group">
        <label>現場量測電力 (kW)</label>
        <input type="number" id="measured_kw" step="0.1" value="12.0">
    </div>

    <button onclick="calculate()">立即驗證</button>

    <div id="result-box">
        <!-- 基礎流量驗證區 -->
        <div class="result-section">
            <div class="section-title">基礎數據驗證</div>
            <div class="result-row">
                <span>現場溫差 (ΔT)：</span>
                <span class="value-text" id="res_dt"></span>
            </div>
            <div class="result-row">
                <span>標準理論流量需求：</span>
                <span class="value-text" id="res_theo_flow"></span>
            </div>
            <div class="result-row">
                <span>流量合理性判定：</span>
                <span id="res_flow_status"></span>
            </div>
        </div>

        <!-- 效能與負載指標區 -->
        <div class="result-section">
            <div class="section-title">效能與負載指標</div>
            <div class="result-row">
                <span>量測負載率 (RT)：</span>
                <span class="value-text" id="res_cooling_load"></span>
            </div>
            <div class="result-row">
                <span>量測耗電負載率 (kW)：</span>
                <span class="value-text" id="res_power_load"></span>
            </div>
            <div class="result-row" style="margin-top: 10px; border-top: 1px solid #333; padding-top: 10px;">
                <span>量測運轉效率：</span>
                <span class="value-text" id="res_measured_eff" style="color: #4A90E2;"></span>
            </div>
            <div class="result-row">
                <span>額定運轉效率：</span>
                <span class="value-text" id="res_rated_eff"></span>
            </div>
            <div class="result-row">
                <span>額定 COP：</span>
                <span class="value-text" id="res_rated_cop"></span>
            </div>
        </div>
    </div>
</div>

<script>
async function calculate() {
    const payload = {
        sys_type: document.getElementById('sys_type').value,
        capacity_val: document.getElementById('capacity_val').value,
        capacity_unit: document.getElementById('capacity_unit').value,
        rated_power_kw: document.getElementById('rated_power_kw').value,
        temp_in: document.getElementById('temp_in').value,
        temp_out: document.getElementById('temp_out').value,
        measured_flow: document.getElementById('measured_flow').value,
        measured_kw: document.getElementById('measured_kw').value
    };

    const response = await fetch('/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    const data = await response.json();
    const resBox = document.getElementById('result-box');
    
    if(data.error) {
        alert(data.error);
        return;
    }

    // 填寫基礎數據
    document.getElementById('res_dt').innerText = `${data.delta_t} °C`;
    document.getElementById('res_theo_flow').innerText = `${data.theoretical_flow} LPM`;
    
    const flowElem = document.getElementById('res_flow_status');
    if (data.is_flow_valid) {
        flowElem.innerHTML = `<span class="valid">✅ 合理 (${data.flow_error_percent > 0 ? '+' : ''}${data.flow_error_percent}%)</span>`;
    } else {
        flowElem.innerHTML = `<span class="invalid">❌ 異常 (${data.flow_error_percent > 0 ? '+' : ''}${data.flow_error_percent}%)</span>`;
    }

    // 填寫效能指標數據
    document.getElementById('res_cooling_load').innerText = `${data.cooling_load_ratio} %`;
    document.getElementById('res_power_load').innerText = `${data.power_load_ratio} %`;
    document.getElementById('res_measured_eff').innerText = `${data.measured_efficiency} kW/RT`;
    document.getElementById('res_rated_eff').innerText = `${data.rated_efficiency} kW/RT`;
    document.getElementById('res_rated_cop').innerText = data.rated_cop;

    resBox.style.display = 'block';
}
</script>
</body>
</html>
